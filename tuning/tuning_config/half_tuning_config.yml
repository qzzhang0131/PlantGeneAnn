format_version: 1
method: half

# Backbone strategy:
# - Mamba-LoRA is fixed to all 16 BiMamba blocks on bidirectionally shared
#   in_proj/out_proj modules (layer indices and target_modules are not YAML knobs)
# - Every ordinary FFN, MoE expert, and MoE router parameter remains frozen
# - No LoRA/adapter is allowed in any backbone feed-forward module
# The backbone FFN/MoE/router freeze and Mamba injection scope are immutable
# runtime-validated policies and are intentionally not exposed as mutable YAML
# fields beyond rank/alpha knobs. Optimizer values are configured in the half
# block below.
half:
  learning_rate: 1.0e-4
  weight_decay: 0.01

# Supported: masked_focal_f1 (PlantGeneAnn) or tiberius_cce_f1.
# All loss hyperparameters use validated built-in defaults.
loss:
  name: masked_focal_f1

training:
  optimizer: adamw
  beta1: 0.9
  beta2: 0.99
  scheduler: cosine  # cosine or linear
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  mixed_precision: bf16
  train_batch_size: 1
  eval_batch_size: 8
  gradient_accumulation_steps: 16
  epochs: 20
  eval_steps: 1000
  logging_steps: 1000
  early_stopping_patience: 2
  metric_for_best_model: macro_f1
  seed: 42
  num_workers: 4

checkpoint:
  save_peft_only: true
  save_full_inference_model: true
  safe_serialization: false
  save_last: false
